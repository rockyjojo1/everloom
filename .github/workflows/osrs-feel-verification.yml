name: OSRS-feel verification

# Independent CI verification for the OSRS-feel production slice work:
# apps/game unit tests, typecheck, production build, and the real-pointer
# osrs-correction-pass.spec.ts Playwright suite. Narrowly scoped to this
# branch (and future osrs-feel branches) rather than every branch in the
# repository.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/osrs-feel-production-slice-6ff2wi
      - "**/osrs-feel-**"

concurrency:
  group: osrs-feel-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify apps/game
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter @everloom/game test

      - name: Typecheck
        run: pnpm --filter @everloom/game typecheck

      - name: Production build
        run: pnpm --filter @everloom/game build

      - name: Install Playwright browser (chromium) and OS dependencies
        run: pnpm --filter @everloom/game exec playwright install --with-deps chromium

      - name: OSRS correction-pass Playwright suite
        run: pnpm --filter @everloom/game exec playwright test tests/osrs-correction-pass.spec.ts

      - name: git diff --check (no whitespace errors)
        run: git diff --check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/game/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces, screenshots, and error context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/game/test-results/
          retention-days: 14
          if-no-files-found: ignore
